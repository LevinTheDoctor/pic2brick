{{- if .Values.cloudflared.enabled }}
# Remote verwalteter Tunnel: Routing (Hostname → Service) steht im Cloudflare-Dashboard,
# hier läuft nur der Connector mit dem Token aus dem Secret.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pic2brick.fullname" . }}-cloudflared
  labels:
    {{- include "pic2brick.labels" . | nindent 4 }}
    app.kubernetes.io/component: tunnel
spec:
  replicas: {{ .Values.cloudflared.replicaCount }}
  selector:
    matchLabels:
      {{- include "pic2brick.tunnelSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pic2brick.labels" . | nindent 8 }}
        app.kubernetes.io/component: tunnel
    spec:
      serviceAccountName: {{ include "pic2brick.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
        # Erlaubt cloudflared ICMP (ping) ohne Root
        sysctls:
          - name: net.ipv4.ping_group_range
            value: "65532 65532"
      containers:
        - name: cloudflared
          image: "{{ .Values.cloudflared.image.repository }}:{{ .Values.cloudflared.image.tag }}"
          imagePullPolicy: {{ .Values.cloudflared.image.pullPolicy }}
          args: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "run"]
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.cloudflared.existingSecret }}
                  key: {{ .Values.cloudflared.existingSecretKey }}
          ports:
            - name: metrics
              containerPort: 2000
          livenessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.cloudflared.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
