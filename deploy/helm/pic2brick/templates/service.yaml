apiVersion: v1
kind: Service
metadata:
  name: {{ include "pic2brick.fullname" . }}
  labels:
    {{- include "pic2brick.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
    - name: tunnel
      port: {{ .Values.service.tunnelPort }}
      targetPort: tunnel
  selector:
    {{- include "pic2brick.webSelectorLabels" . | nindent 4 }}
