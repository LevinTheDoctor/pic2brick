# helm test: Startseite, Backend über den Proxy und gesperrte Betriebs-Endpunkte
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "pic2brick.fullname" . }}-test
  labels:
    {{- include "pic2brick.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: test
      image: {{ include "pic2brick.image" . }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      command: ["sh", "-c"]
      args:
        - |
          set -e
          base=http://{{ include "pic2brick.fullname" . }}:{{ .Values.service.port }}
          wget -q -O /dev/null "$base/"
          wget -q -O - "$base/api/gesundheit"
          if wget -q -O /dev/null "$base/api/actuator/health"; then
            echo "/api/actuator ist öffentlich erreichbar" >&2; exit 1
          fi
          echo ok
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
  {{- with .Values.nodeSelector }}
  nodeSelector:
    {{- toYaml . | nindent 4 }}
  {{- end }}
